name: Public corpus checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  public-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 .github/scripts/public_corpus.py
      - name: Exercise public-text mutations
        run: python3 -m unittest discover -s supporting-materials/computations/tests -p test_public_corpus.py -v
