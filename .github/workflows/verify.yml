name: Temporary n=7 primary-cutoff audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-n7-primary-cutoff-${{ github.ref }}
  cancel-in-progress: false

jobs:
  primary-cutoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        root: [0, 1, 4, 8, 16, 32, 128]
    steps:
      - name: Check out computation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.14"
          enable-cache: true

      - name: Install pinned Python environment
        run: uv sync --frozen

      - name: Prove the primary root strictly exceeds five million calls
        env:
          N7_FACE7_CALL_LIMIT: "5000000"
        run: |
          uv run --frozen python supporting-materials/computations/python/n7_primary_cutoff_audit.py --root ${{ matrix.root }} --out primary-root-${{ matrix.root }}.json

      - name: Upload cutoff audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: n7-primary-cutoff-root-${{ matrix.root }}
          path: primary-root-${{ matrix.root }}.json
          if-no-files-found: error
          retention-days: 5
          compression-level: 0
