name: Verify paper and certificates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.14"
          enable-cache: true

      - name: Install pinned Python environment
        run: uv sync --frozen

      - name: Run exact-certificate and manuscript-table tests
        run: make test

      - name: Regenerate symbolic and exact proof certificates
        run: |
          make proof-check all-n-reduction-check \
            dirichlet-poissonization-check \
            n3-formula-check n3-certificate-check \
            n4-structure-check n4-certificate-check \
            n5-structure-check n5-certificate-check \
            poisson-band-certificate-check one-cap-all-n-check \
            one-cap-certificate-check

      - name: Verify generated certificate summary and claim manifest
        run: make certificate-summary-check claim-manifest-check

      - name: Set up Tectonic
        uses: WtfJoke/setup-tectonic@eb29fd68b7d3f76011906b6e45ea4320c8de5d2f # v4.0.5
        with:
          tectonic-version: "0.17.0"

      - name: Build manuscript without layout warnings
        run: make paper

  n6-structure-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.14"
          enable-cache: true

      - name: Install pinned Python environment
        run: uv sync --frozen

      - name: Regenerate proof-independent n=6 structure data
        run: make n6-structure-data-check

  n6-face-ideals:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        group:
          - standard-0
          - standard-1
          - standard-2
          - standard-3
          - standard-4
          - standard-5
          - c6-0
          - c6-1
          - c6-2
          - d6-0
          - d6-1
          - d6-2
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.14"
          enable-cache: true

      - name: Install pinned Python environment
        run: uv sync --frozen

      - name: Install exact polynomial algebra engine
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y singular
          Singular --version

      - name: Verify generic n=6 face-ideal group
        run: >-
          uv run --frozen python
          supporting-materials/computations/python/derive_n6_bernstein_structure.py
          --face-proof-group ${{ matrix.group }}

  n6-certificate:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        alpha: ["0.01", "0.05", "0.10"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.14"
          enable-cache: true

      - name: Install pinned Python environment
        run: uv sync --frozen

      - name: Regenerate directed-interval n=6 certificate level
        run: >-
          uv run --frozen python
          supporting-materials/computations/python/n6_gaffke_certificate.py
          --check-alpha ${{ matrix.alpha }}
