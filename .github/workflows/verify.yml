name: Temporary distributed n=7 final-certificate resume (512 shards)

on:
  workflow_dispatch:
    inputs:
      shards:
        description: JSON array of deterministic 512-shard indices to resume
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: compute-n7-final-resume-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  seven-positive-face:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(inputs.shards) }}
    steps:
      - name: Check out computation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.14"
          enable-cache: true

      - name: Install pinned Python environment
        run: uv sync --frozen

      - name: Restore all reusable records for this shard
        run: |
          echo "525d91c7354903c53a8c0acf3605438ad68cb713f42f02ffef7dce8d438d0aea  supporting-materials/computations/certificates/n7-final-union-seeds-512.tar.gz" | shasum -a 256 -c -
          mkdir -p .work/n7
          tar -xzf supporting-materials/computations/certificates/n7-final-union-seeds-512.tar.gz -C .work/n7 shard-${{ matrix.shard }}.jsonl

      - name: Complete one deterministic 512-shard unit
        run: |
          uv run --frozen python \
            supporting-materials/computations/python/n7_dirichlet_poissonization.py \
            --face 7 --workers 4 \
            --checkpoint .work/n7/shard-${{ matrix.shard }}.jsonl \
            --shard-index ${{ matrix.shard }} --shard-count 512 \
            --out .work/n7/shard-${{ matrix.shard }}-aggregate.json \
            --progress

      - name: Upload per-root records and aggregate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: n7-face7-512-shard-${{ matrix.shard }}
          path: .work/n7/shard-${{ matrix.shard }}*
          if-no-files-found: error
          retention-days: 5
          compression-level: 0
